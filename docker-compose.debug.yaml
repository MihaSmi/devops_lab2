services:
  frontend:
    build:
      context: services/frontend
      dockerfile: dockerfile/Dev.Dockerfile
    ports:
      - 8092:5173
    environment:
      VITE_API_URL: http://127.0.0.1:8090
    volumes:
      - ./services/frontend/src/:/app/src/
      - ./services/frontend/public/:/app/public/
      - ./services/frontend/index.html:/app/index.html
      - ./services/frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ./services/frontend/tsconfig.node.json:/app/tsconfig.node.json
      - ./services/frontend/tsconfig.json:/app/tsconfig.json
      - ./services/frontend/vite.config.ts:/app/vite.config.ts
    entrypoint:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
  app:
    build:
      context: services/backend
      dockerfile: Dockerfile
      args:
        EXTRA_GROUPS: "dev"
    ports:
      - 8090:5000
      - 5678:5678
    environment:
      DB_NAME: debug_db
    entrypoint:
      - uvicorn
      - src.main:app
      - --reload
      - --host
      - 0.0.0.0
      - --port
      - "5000"
    volumes:
      - ./services/backend/src/:/app/src/
      - ./services/backend/config.json:/app/config.json
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - db_password
  db:
    image: postgres:18-alpine
    ports:
      - 8765:5432
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: debug_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d debug_db"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
volumes:
  pg_data:
secrets:
  db_password:
    file: ./secrets/db_password
