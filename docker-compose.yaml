services:
  frontend:
    build:
      context: services/frontend
      dockerfile: dockerfile/Prod.Dockerfile
    ports:
      - 80:80
    depends_on:
      - app
  app:
    build:
      context: services/backend
      dockerfile: Dockerfile
    environment:
      DB_NAME: notes_db
    entrypoint:
      - uvicorn
      - src.main:app
      - --host
      - 0.0.0.0
      - --port
      - "5000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 8090:5000
    secrets:
      - db_password
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: notes_db
    secrets:
      - db_password
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d notes_db"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
volumes:
  pg_data:
secrets:
  db_password:
    file: ./secrets/db_password
